baseURL: 'https://oaiba.github.io/ExtractionDocument/'
languageCode: 'en-us'
title: 'Extraction Document'
theme: 'hextra'
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    label: English
    languageName: English
    locale: en-US
    weight: 1
  vi:
    label: Tiếng Việt
    languageName: Tiếng Việt
    locale: vi-VN
    weight: 2

markup:
  goldmark:
    renderer:
      unsafe: true

uglyURLs: true

params:
  theme:
    displayToggle: false
  search:
    enable: true
    type: flexsearch
    flexsearch:
      index: content
  footer:
    displayPoweredBy: false

menu:
  main:
    - identifier: agents
      name: Agents
      pageRef: /GDD_Agents
      weight: 1
    - identifier: design
      name: Design
      pageRef: /GDD_Design
      weight: 2
    - identifier: technical
      name: Technical
      pageRef: /GDD_Technical
      weight: 3
    - identifier: language
      name: Language
      weight: 8
      params:
        type: language-switch
        label: true
    - identifier: theme
      name: Theme
      weight: 9
      params:
        type: theme-toggle
    - identifier: search
      name: Search
      weight: 10
      params:
        type: search
