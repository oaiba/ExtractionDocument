<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <title>Extraction Shooter GDD</title>
  <meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1" />
  <meta name="description" content="Extraction Shooter Game Design Document">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/style.min.css"
    title="docsify-darklight-theme" type="text/css" />
  <style>
    /* Logo styling */
    :root {
      --docsifytabs-border-color: #ededed;
      --docsifytabs-tab-highlight-color: purple;
    }

    .app-name-link img {
      height: 140px;
      object-fit: contain;
    }

    .sidebar-nav {
      margin-top: 20px;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script>
    window.docsify = {
      logo: 'assets/logo.svg',
      name: 'Extraction Shooter GDD',
      repo: 'https://github.com/oaiba/ExtractionDocument',
      loadSidebar: true,
      loadNavbar: 'navbar.md',
      mergeNavbar: false,
      subMaxLevel: 2,
      auto2top: true,
      // Pagination Configuration
      pagination: {
        previousText: 'Previous',
        nextText: 'Next',
        crossChapter: true,
        crossChapterText: true,
      },
      // Search Plugin Configuration
      search: {
        maxAge: 86400000, // Expiration time, the default is one day
        paths: 'auto',
        placeholder: 'Type to search',
        noData: 'No Results!',
        // Headline depth, 1 - 6
        depth: 6,
        hideOtherSidebarContent: false, // whether or not to hide other sidebar content
      },
      autoHeaders: {
        separator: '.',
        debug: false
      },
      // Dark/Light Theme Configuration
      darklightTheme: {
        defaultTheme: 'dark', // default to dark mode
        siteFont: 'Menlo, Monaco, Consolas, "Courier New", monospace', // MONOSPACE FONT
        dark: {
          accent: '#42b983',
          toogleBackground: '#ffffff',
          background: '#091a28',
          textColor: '#b4b4b4',
          codeTextColor: '#a6accd', // Improved contrast for code
          codeBackgroundColor: '#0d1117', // Darker background for code blocks
          borderColor: '#0d2538',
          blockQuoteColour: '#858585',
          highlightColor: '#d22778',
          sidebarSublink: '#b4b4b4',
          codeTypeColor: '#ffffff',
          coverBackground: 'linear-gradient(to left bottom, #2f815d 0%, #0d2538 100%)',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/sun.svg)'
        },
        light: {
          accent: '#42b983',
          toogleBackground: '#091a28',
          background: '#ffffff',
          textColor: '#34495e',
          codeTextColor: '#24292e', // Darker text for code in light mode
          codeBackgroundColor: '#f6f8fa', // Lighter background for code blocks
          borderColor: 'rgba(0, 0, 0, 0.07)',
          blockQuoteColour: '#858585',
          highlightColor: '#d22778',
          sidebarSublink: '#34495e',
          codeTypeColor: '#091a28',
          coverBackground: 'linear-gradient(to left bottom, hsl(118, 100%, 85%) 0%,hsl(181, 100%, 85%) 100%)',
          toogleImage: 'url(https://cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/icons/moon.svg)'
        }
      }
    }
  </script>
  <!-- Docsify v4 -->
  <script src="//cdn.jsdelivr.net/npm/docsify@4"></script>
  <!-- Plugins -->
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify/lib/plugins/zoom-image.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-copy-code/dist/docsify-copy-code.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-darklight-theme@latest/dist/index.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-auto-headers@latest/dist/docsify-auto-headers.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify-pagination/dist/docsify-pagination.min.js"></script>
</body>

</html>
