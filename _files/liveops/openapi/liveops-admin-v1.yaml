openapi: 3.1.0
info:
  title: LiveOps Admin API
  version: 1.0.0
  description: Executable Admin Backoffice contract. Actor identity is derived from OIDC.
servers:
  - url: https://api.example.invalid
tags:
  - {name: Identity}
  - {name: Operations}
  - {name: LiveOps}
  - {name: Player Support}
  - {name: Audit}
paths:
  /v1/admin/me:
    get:
      tags: [Identity]
      security: [{oidcBearer: []}]
      responses: {'200': {$ref: '#/components/responses/AdminIdentity'}, '401': {$ref: '#/components/responses/Unauthorized'}}
  /v1/admin/roles:
    get:
      tags: [Identity]
      security: [{oidcBearer: []}]
      responses: {'200': {description: Roles, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/AdminRole'}}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /v1/admin/permissions:
    get:
      tags: [Identity]
      security: [{oidcBearer: []}]
      responses: {'200': {description: Permissions, content: {application/json: {schema: {type: array, items: {$ref: '#/components/schemas/Permission'}}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /v1/admin/dashboard/summary:
    get:
      tags: [Operations]
      security: [{oidcBearer: []}]
      responses: {'200': {description: Summary, content: {application/json: {schema: {$ref: '#/components/schemas/DashboardSummary'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /v1/admin/servers:
    get:
      tags: [Operations]
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {$ref: '#/components/responses/PagedServers'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /v1/admin/queues:
    get:
      tags: [Operations]
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {$ref: '#/components/responses/PagedQueues'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /v1/admin/incidents:
    get:
      tags: [Operations]
      x-required-permission: incident.read
      x-environment-scope: all
      x-audit-action: incident.listed
      x-danger-level: low
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {$ref: '#/components/responses/PagedIncidents'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /v1/admin/liveops/configs:
    get:
      tags: [LiveOps]
      x-required-permission: config.read
      x-environment-scope: all
      x-audit-action: liveops.config.listed
      x-danger-level: low
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {name: configType, in: query, schema: {type: string}}, {name: environment, in: query, schema: {$ref: '#/components/schemas/Environment'}}, {name: status, in: query, schema: {$ref: '#/components/schemas/ConfigStatus'}}]
      responses: {'200': {$ref: '#/components/responses/PagedConfigs'}, '403': {$ref: '#/components/responses/Forbidden'}}
    post:
      tags: [LiveOps]
      x-required-permission: config.create
      x-environment-scope: all
      x-audit-action: liveops.config.created
      x-danger-level: low
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/RequestId'}]
      requestBody: {$ref: '#/components/requestBodies/Mutation'}
      responses: {'201': {description: Draft created, content: {application/json: {schema: {$ref: '#/components/schemas/LiveOpsConfig'}}}}, '400': {$ref: '#/components/responses/BadRequest'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /v1/admin/liveops/configs/{id}:
    parameters: [{name: id, in: path, required: true, schema: {type: string}}]
    get:
      tags: [LiveOps]
      security: [{oidcBearer: []}]
      responses: {'200': {description: Config, content: {application/json: {schema: {$ref: '#/components/schemas/LiveOpsConfig'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
    patch:
      tags: [LiveOps]
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/IdempotencyKey'}, {$ref: '#/components/parameters/RequestId'}, {$ref: '#/components/parameters/IfMatch'}]
      requestBody: {$ref: '#/components/requestBodies/Mutation'}
      responses: {'200': {description: Draft updated, content: {application/json: {schema: {$ref: '#/components/schemas/LiveOpsConfig'}}}}, '409': {$ref: '#/components/responses/Conflict'}}
  /v1/admin/liveops/configs/{id}/validate:
    post: {tags: [LiveOps], x-required-permission: config.validate, x-environment-scope: all, x-audit-action: liveops.config.validated, x-danger-level: low, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], responses: {'200': {description: Validation result, content: {application/json: {schema: {$ref: '#/components/schemas/ValidationResult'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /v1/admin/liveops/configs/{id}/submit-review:
    post: {tags: [LiveOps], x-required-permission: config.submit_review, x-environment-scope: all, x-audit-action: liveops.config.submitted, x-danger-level: medium, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Mutation'}, responses: {'200': {description: Review, content: {application/json: {schema: {$ref: '#/components/schemas/ConfigReview'}}}}, '409': {$ref: '#/components/responses/Conflict'}}}
  /v1/admin/liveops/configs/{id}/approve:
    post: {tags: [LiveOps], x-required-permission: config.approve, x-environment-scope: production, x-audit-action: liveops.config.approved, x-danger-level: high, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Mutation'}, responses: {'200': {description: Approval, content: {application/json: {schema: {$ref: '#/components/schemas/ConfigReview'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /v1/admin/liveops/configs/{id}/publish:
    post: {tags: [LiveOps], x-required-permission: config.publish, x-environment-scope: production, x-audit-action: liveops.config.published, x-danger-level: critical, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Mutation'}, responses: {'200': {description: Publication, content: {application/json: {schema: {$ref: '#/components/schemas/ConfigPublication'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /v1/admin/liveops/configs/{id}/rollback:
    post: {tags: [LiveOps], x-required-permission: config.rollback, x-environment-scope: production, x-audit-action: liveops.config.rolled_back, x-danger-level: critical, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Mutation'}, responses: {'201': {description: Rollback config, content: {application/json: {schema: {$ref: '#/components/schemas/LiveOpsConfig'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /v1/admin/liveops/configs/{id}/diff:
    get: {tags: [LiveOps], x-required-permission: config.read, x-environment-scope: all, x-audit-action: liveops.config.diff_viewed, x-danger-level: low, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: compareVersion, in: query, required: true, schema: {type: integer}}], responses: {'200': {description: Diff, content: {application/json: {schema: {$ref: '#/components/schemas/ConfigDiff'}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
  /v1/admin/players:
    get:
      tags: [Player Support]
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {name: query, in: query, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/PagedPlayers'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /v1/admin/players/{id}:
    get:
      tags: [Player Support]
      security: [{oidcBearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Player, content: {application/json: {schema: {$ref: '#/components/schemas/Player'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /v1/admin/players/{id}/matches:
    get: {tags: [Player Support], x-required-permission: match.read, x-environment-scope: all, x-audit-action: player.matches_viewed, x-danger-level: low, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}], responses: {'200': {description: Matches, content: {application/json: {schema: {$ref: '#/components/schemas/PagedMatches'}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
  /v1/admin/players/{id}/inventory-audit:
    get: {tags: [Player Support], x-required-permission: inventory.read, x-environment-scope: all, x-audit-action: player.inventory_audit_viewed, x-danger-level: low, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}], responses: {'200': {description: Inventory audit, content: {application/json: {schema: {$ref: '#/components/schemas/PagedAuditRows'}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
  /v1/admin/players/{id}/wallet-ledger:
    get: {tags: [Player Support], x-required-permission: ledger.read, x-environment-scope: all, x-audit-action: player.wallet_ledger_viewed, x-danger-level: low, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}], responses: {'200': {description: Wallet ledger, content: {application/json: {schema: {$ref: '#/components/schemas/PagedLedgerRows'}}}}, '404': {$ref: '#/components/responses/NotFound'}}}
  /v1/admin/players/{id}/revoke-sessions:
    post: {tags: [Player Support], x-required-permission: session.revoke, x-environment-scope: all, x-audit-action: admin.command.revoke_sessions, x-danger-level: medium, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Mutation'}, responses: {'202': {description: Command, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCommandResult'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /v1/admin/players/{id}/grant:
    post: {tags: [Player Support], x-required-permission: grant.execute, x-environment-scope: all, x-audit-action: admin.command.grant, x-danger-level: high, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Mutation'}, responses: {'202': {description: Command, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCommandResult'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /v1/admin/players/{id}/revoke:
    post: {tags: [Player Support], x-required-permission: revoke.execute, x-environment-scope: all, x-audit-action: admin.command.revoke, x-danger-level: high, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Mutation'}, responses: {'202': {description: Command, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCommandResult'}}}}, '403': {$ref: '#/components/responses/Forbidden'}, '409': {$ref: '#/components/responses/Conflict'}}}
  /v1/admin/players/{id}/sanctions:
    post: {tags: [Player Support], x-required-permission: sanction.execute, x-environment-scope: all, x-audit-action: admin.command.sanction, x-danger-level: high, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Mutation'}, responses: {'202': {description: Command, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCommandResult'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /v1/admin/players/{id}/unsanction:
    post: {tags: [Player Support], x-required-permission: sanction.execute, x-environment-scope: all, x-audit-action: admin.command.unsanction, x-danger-level: high, security: [{oidcBearer: []}], parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/IdempotencyKey'}], requestBody: {$ref: '#/components/requestBodies/Mutation'}, responses: {'202': {description: Command, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCommandResult'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}}
  /v1/admin/audit-events:
    get:
      tags: [Audit]
      security: [{oidcBearer: []}]
      parameters: [{$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}, {name: actorSubject, in: query, schema: {type: string}}, {name: action, in: query, schema: {type: string}}, {name: targetId, in: query, schema: {type: string}}]
      responses: {'200': {$ref: '#/components/responses/PagedAuditEvents'}, '403': {$ref: '#/components/responses/Forbidden'}}
  /v1/admin/audit-events/{id}:
    get:
      tags: [Audit]
      security: [{oidcBearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Audit event, content: {application/json: {schema: {$ref: '#/components/schemas/AuditEvent'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /v1/admin/incidents/{id}:
    get:
      tags: [Operations]
      x-required-permission: incident.read
      x-environment-scope: all
      x-audit-action: incident.viewed
      x-danger-level: low
      security: [{oidcBearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Incident detail, content: {application/json: {schema: {$ref: '#/components/schemas/Incident'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /v1/admin/servers/{id}:
    get:
      tags: [Operations]
      x-required-permission: server.read
      x-environment-scope: all
      x-audit-action: server.viewed
      x-danger-level: low
      security: [{oidcBearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Server detail, content: {application/json: {schema: {$ref: '#/components/schemas/Server'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /v1/admin/queues/{id}:
    get:
      tags: [Operations]
      x-required-permission: queue.read
      x-environment-scope: all
      x-audit-action: queue.viewed
      x-danger-level: low
      security: [{oidcBearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}]
      responses: {'200': {description: Queue detail, content: {application/json: {schema: {$ref: '#/components/schemas/Queue'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /v1/admin/players/{id}/sanctions:
    get:
      tags: [Player Support]
      x-required-permission: sanction.read
      x-environment-scope: all
      x-audit-action: sanction.listed
      x-danger-level: low
      security: [{oidcBearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string, format: uuid}}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Sanctions, content: {application/json: {schema: {$ref: '#/components/schemas/PagedSanctions'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /v1/admin/liveops/configs/{id}/history:
    get:
      tags: [LiveOps]
      x-required-permission: config.read
      x-environment-scope: all
      x-audit-action: liveops.config.history_viewed
      x-danger-level: low
      security: [{oidcBearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {$ref: '#/components/parameters/Limit'}, {$ref: '#/components/parameters/Cursor'}]
      responses: {'200': {description: Config history, content: {application/json: {schema: {$ref: '#/components/schemas/PagedConfigs'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
  /v1/admin/liveops/configs/{id}/projections:
    get:
      tags: [LiveOps]
      x-required-permission: config.read
      x-environment-scope: all
      x-audit-action: liveops.config.projection_viewed
      x-danger-level: medium
      security: [{oidcBearer: []}]
      parameters: [{name: id, in: path, required: true, schema: {type: string}}, {name: projection, in: query, required: true, schema: {type: string, enum: [client, server, admin]}}]
      responses: {'200': {description: Filtered projection, content: {application/json: {schema: {$ref: '#/components/schemas/LiveOpsConfig'}}}}, '403': {$ref: '#/components/responses/Forbidden'}}
  /v1/admin/commands/{commandId}:
    get:
      tags: [Player Support]
      x-required-permission: command.read
      x-environment-scope: all
      x-audit-action: admin.command.viewed
      x-danger-level: low
      security: [{oidcBearer: []}]
      parameters: [{name: commandId, in: path, required: true, schema: {type: string, format: uuid}}]
      responses: {'200': {description: Command status, content: {application/json: {schema: {$ref: '#/components/schemas/AdminCommandResult'}}}}, '404': {$ref: '#/components/responses/NotFound'}}
components:
  securitySchemes:
    oidcBearer: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    Limit: {name: limit, in: query, schema: {type: integer, minimum: 1, maximum: 100, default: 50}}
    Cursor: {name: cursor, in: query, schema: {type: string}}
    IdempotencyKey: {name: Idempotency-Key, in: header, required: true, schema: {type: string, format: uuid}}
    RequestId: {name: X-Request-Id, in: header, schema: {type: string}}
    IfMatch: {name: If-Match, in: header, schema: {type: string}}
  requestBodies:
    Mutation: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/MutationRequest'}}}}
  responses:
    AdminIdentity: {description: Current identity, content: {application/json: {schema: {$ref: '#/components/schemas/AdminIdentity'}}}}
    PagedServers: {description: Servers, content: {application/json: {schema: {$ref: '#/components/schemas/PagedServers'}}}}
    PagedQueues: {description: Queues, content: {application/json: {schema: {$ref: '#/components/schemas/PagedQueues'}}}}
    PagedIncidents: {description: Incidents, content: {application/json: {schema: {$ref: '#/components/schemas/PagedIncidents'}}}}
    PagedConfigs: {description: Configs, content: {application/json: {schema: {$ref: '#/components/schemas/PagedConfigs'}}}}
    PagedPlayers: {description: Players, content: {application/json: {schema: {$ref: '#/components/schemas/PagedPlayers'}}}}
    PagedAuditEvents: {description: Audit events, content: {application/json: {schema: {$ref: '#/components/schemas/PagedAuditEvents'}}}}
    Unauthorized: {description: Authentication required, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    Forbidden: {description: Permission denied, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    BadRequest: {description: Invalid request, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    Conflict: {description: Conflict, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
    NotFound: {description: Not found, content: {application/json: {schema: {$ref: '#/components/schemas/ErrorEnvelope'}}}}
  schemas:
    Environment: {type: string, enum: [development, stage, production]}
    ConfigStatus: {type: string, enum: [draft, validated, in_review, approved, scheduled, published, active, rolled_back, archived, rejected, expired]}
    Permission: {type: object, required: [name], properties: {name: {type: string}, description: {type: string}}}
    AdminRole: {type: object, required: [name, permissions], properties: {name: {type: string}, permissions: {type: array, items: {type: string}}, environments: {type: array, items: {$ref: '#/components/schemas/Environment'}}}}
    AdminIdentity: {type: object, required: [subject, email, roles, environments], properties: {subject: {type: string}, email: {type: string, format: email}, displayName: {type: string}, roles: {type: array, items: {type: string}}, environments: {type: array, items: {$ref: '#/components/schemas/Environment'}}}}
    MutationRequest: {type: object, required: [idempotencyKey, reason, payload], properties: {idempotencyKey: {type: string, format: uuid}, reason: {type: string, minLength: 3, maxLength: 1000}, confirmation: {type: string, enum: [CONFIRM]}, payload: {type: object}}}
    LiveOpsConfig: {type: object, required: [configId, configType, schemaVersion, configVersion, environment, status, payload], properties: {configId: {type: string}, configType: {type: string}, schemaVersion: {type: integer, minimum: 1}, configVersion: {type: integer, minimum: 1}, environment: {$ref: '#/components/schemas/Environment'}, status: {$ref: '#/components/schemas/ConfigStatus'}, effectiveFrom: {type: string, format: date-time}, effectiveTo: {type: string, format: date-time, nullable: true}, createdBy: {type: string}, publishedBy: {type: string, nullable: true}, reason: {type: string}, checksum: {type: string}, payload: {type: object}}}
    ConfigReview: {type: object, required: [configId, status], properties: {configId: {type: string}, status: {type: string, enum: [in_review, approved, rejected]}, reviewerSubject: {type: string}, reason: {type: string}, reviewedAt: {type: string, format: date-time}}}
    ConfigPublication: {type: object, required: [configId, version, publishedAt], properties: {configId: {type: string}, version: {type: integer}, publishedAt: {type: string, format: date-time}, checksum: {type: string}}}
    ValidationResult: {type: object, required: [valid, errors], properties: {valid: {type: boolean}, errors: {type: array, items: {type: object, required: [code, path, message], properties: {code: {type: string}, path: {type: string}, message: {type: string}}}}}}
    AdminCommandResult: {type: object, required: [commandId, status], properties: {commandId: {type: string, format: uuid}, status: {type: string, enum: [accepted, running, succeeded, failed, duplicate]}, result: {type: object}, failureCode: {type: string, nullable: true}}}
    AuditEvent: {type: object, required: [id, actorSubject, action, target, environment, requestId, occurredAt], properties: {id: {type: string, format: uuid}, actorSubject: {type: string}, actorRole: {type: string}, action: {type: string}, target: {type: object}, before: {type: object, nullable: true}, after: {type: object, nullable: true}, reason: {type: string}, environment: {$ref: '#/components/schemas/Environment'}, requestId: {type: string}, occurredAt: {type: string, format: date-time}}}
    ErrorEnvelope: {type: object, required: [error], properties: {error: {type: object, required: [code, message, requestId, retryable], properties: {code: {type: string}, message: {type: string}, requestId: {type: string}, retryable: {type: boolean}}}}}
    DashboardSummary: {type: object, properties: {ccu: {type: integer}, apiP95Ms: {type: number}, queueDepth: {type: integer}, activeServers: {type: integer}, activeConfigVersion: {type: integer}, incidents: {type: integer}}}
    Server: {type: object, properties: {id: {type: string}, region: {type: string}, buildId: {type: string}, status: {type: string}, lastHeartbeatAt: {type: string, format: date-time}, capacity: {type: integer}}}
    Queue: {type: object, properties: {queueId: {type: string}, enabled: {type: boolean}, region: {type: string}, depth: {type: integer}, waitSeconds: {type: number}}}
    Incident: {type: object, properties: {id: {type: string}, severity: {type: string}, status: {type: string}, title: {type: string}, startedAt: {type: string, format: date-time}}}
    Player: {type: object, properties: {id: {type: string, format: uuid}, displayName: {type: string}, status: {type: string}, createdAt: {type: string, format: date-time}}}
